[tool.ruff]
target-version = "py38"
line-length = 119
include = ["pyproject.toml", "src/**/*.py", "test/**/*.py"]

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I"]
ignore = ["E501", "I001"]

[tool.ruff.format]
quote-style = "single"

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "e", "f"]
disable = ['C0112', 'C0114', 'C0115', 'C0116', 'R0903']

[tool.pylint.format]
max-line-length = 119

[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true
explicit_package_bases = true
# ignore_missing_imports = true
show_error_context = true
show_column_numbers = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = [
    "test",
]
xfail_strict = true
pythonpath = "src"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
